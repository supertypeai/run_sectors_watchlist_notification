name: Run Watchlist Notification

on:
  schedule:
    # Mondays at 12:00 WIB (05:00 UTC). GitHub starts scheduled runs late under
    # load, by about four hours in this repo's history, so the email arrives
    # later than this says.
    - cron: '0 5 * * 1'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Fails the job on any answer but a clean 200, so a broken run is red and not silently green
      - name: Trigger Watchlist Notification API
        env:
          BEARER_TOKEN: ${{ secrets.SECRET }}
        run: bash scripts/trigger.sh

      # Also on failure: the log line is how a bad run gets noticed, and committing it keeps
      # GitHub from switching the schedule off after 60 days without activity
      - name: Commit and push logs
        if: always()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add logs/
          git commit -m "Add workflow run log - $(date -u +"%Y-%m-%d %H:%M:%S UTC")" || echo "No changes to commit"
          git push
